<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>UNIFORM WEATHER</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100dvh;
      display:grid;
      place-items:center;
      padding:20px;
      background:#f3f6f9;
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
      color:#18263b
    }
    section{
      width:min(100%,390px);
      padding:24px;
      border-radius:20px;
      background:#fff;
      border:1px solid #e3e9ef;
      text-align:center
    }
    h1{font-size:19px;margin:0 0 9px}
    p{color:#667487;font-size:13px;line-height:1.6}
    a{
      display:block;
      margin-top:15px;
      padding:12px;
      border-radius:12px;
      background:#2f6fae;
      color:#fff;
      text-decoration:none;
      font-weight:800
    }
  </style>
</head>
<body>
<section>
  <h1>天気データを再取得します</h1>
  <p>{{ message }}</p>
  <a href="/">再読み込み</a>
</section>
</body>
</html>
